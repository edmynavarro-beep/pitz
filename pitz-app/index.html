<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F2C8C"><script src="config.js"></script><title>Pitz · tu pit stop de confianza</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito+Sans:wght@400;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>:root{--royal:#0F2C8C;--royal2:#1A3FAF;--navy:#0B1F4B;--navy2:#16358A;--sky:#BFE3FA;--sky2:#E3F2FD;--paper:#F3F6FC;--ink:#0B1F4B;--mut:#6B7A99;--pl:#E1E8F4;--coral:#FF4D6D;--cream:#FBF4E4;--ok:#1E9E63;--warn:#F2B33D;--bad:#D93636;--f1:'Sora','Nunito Sans',system-ui,sans-serif;--f2:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--f3:'Caveat','Segoe Script',cursive}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--f2);font-size:15px;line-height:1.45;color:var(--ink);background:#D9E2F2;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:100%;max-width:430px;height:100dvh;max-height:900px;background:var(--paper);overflow:hidden;isolation:isolate}
@media(min-width:520px){.phone{height:min(100dvh - 24px,880px);border-radius:40px;box-shadow:0 40px 80px -30px rgba(11,31,75,.55),0 0 0 8px #0B1F4B}}
.stage{position:absolute;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:max(22px,env(safe-area-inset-top)) 18px 112px;display:flex;flex-direction:column;gap:12px;background:var(--paper);scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.royal{background:var(--royal);color:var(--cream)}
.screen.nonav{padding-bottom:24px}
.screen.full{padding:0}
.screen>*{flex:none}
/* tipografía */
.t1{font-family:var(--f1);font-weight:800;font-size:27px;line-height:1.1;letter-spacing:-.03em;color:var(--navy)}
.t2{font-family:var(--f1);font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--navy)}
.t3{font-family:var(--f1);font-weight:700;font-size:15px;color:var(--navy)}
.mut{color:var(--mut)}.k{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.big{font-family:var(--f1);font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1.05}
.sm{font-size:13px}.xs{font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row.g{justify-content:flex-start}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.hand{font-family:var(--f3);font-size:26px;color:var(--cream)}
.blob{position:absolute;width:300px;height:300px;border-radius:50%;background:var(--sky);right:-120px;top:-120px;z-index:0;pointer-events:none}
.screen>*{position:relative;z-index:1}
/* iconos */
.ic{display:inline-flex;width:20px;height:20px;flex:none}.ic svg{width:100%;height:100%}
.back{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 2px 8px -2px rgba(11,31,75,.25);display:grid;place-items:center;flex:none}
/* tarjetas */
.c{background:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 8px 22px -14px rgba(11,31,75,.35)}
.c.navy{background:linear-gradient(150deg,#0B1F4B,#16358A);color:#fff}.c.navy .k,.c.navy .mut{color:#A9BEE8}
.c.sky{background:var(--sky2);box-shadow:none}
.c.warn{background:#FFF4DA;box-shadow:0 0 0 1px #F2D58A inset}.c.bad{background:#FFE9EC;box-shadow:0 0 0 1px #F5B7C1 inset}
.c.tap{cursor:pointer;transition:transform .15s}.c.tap:active{transform:scale(.98)}
.c.sel{box-shadow:0 0 0 2px var(--royal) inset}
.c.flat{box-shadow:0 0 0 1px var(--pl) inset}
/* botones */
.cta{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--navy);color:#fff;border-radius:99px;padding:6px 6px 6px 22px;min-height:52px;font-family:var(--f1);font-weight:700;font-size:15px;box-shadow:0 14px 26px -14px rgba(11,31,75,.8);transition:transform .15s}
.cta .arr{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;transition:transform .2s}
.cta:active{transform:scale(.97)}.cta:hover .arr{transform:translateX(3px)}
.cta.coral{background:var(--coral)}.cta.coral .arr{color:var(--coral)}
.cta[disabled]{opacity:.45;pointer-events:none}
.btn2{width:100%;min-height:46px;border-radius:99px;border:1.5px solid var(--navy);color:var(--navy);font-family:var(--f1);font-weight:700;font-size:14px;padding:0 18px;background:transparent;transition:transform .15s}
.btn2:active{transform:scale(.97)}.btn2.light{border-color:var(--cream);color:var(--cream)}
.btn3{min-height:40px;border-radius:99px;background:var(--navy);color:#fff;font-family:var(--f1);font-weight:700;font-size:13.5px;padding:0 18px;transition:transform .15s}
.btn3:active{transform:scale(.96)}.btn3.sm{min-height:34px;padding:0 14px;font-size:12.5px}.btn3.ghost{background:#fff;color:var(--navy);box-shadow:0 0 0 1.5px var(--navy) inset}
.btn3.coral{background:var(--coral)}.btn3.ok{background:var(--ok)}
.link{color:var(--royal);font-weight:800}
/* chips */
.ch{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:800;white-space:nowrap}
.ch.ok{background:#D2EFE0;color:#115C38}.ch.warn{background:#FCEBC6;color:#6E4A0A}.ch.bad{background:#FBD5D5;color:#8E1F1F}.ch.info{background:#D9E8FB;color:#0F2C8C}.ch.mu{background:#E3E7F0;color:#3C4763}.ch.dark{background:var(--navy);color:#fff}
.chs{display:flex;flex-wrap:wrap;gap:6px}
.tg{padding:7px 13px;border-radius:99px;background:#fff;box-shadow:0 0 0 1px var(--pl) inset;font-weight:700;font-size:13px;transition:background .15s,color .15s}
.tg.on{background:var(--navy);color:#fff;box-shadow:none}
.scroll-x{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.scroll-x::-webkit-scrollbar{display:none}
.scroll-x>*{flex:none}
/* campos */
.fl{display:block;background:#fff;border:1.5px solid var(--pl);border-radius:14px;padding:7px 13px;transition:border-color .15s}
.fl:focus-within{border-color:var(--royal)}
.fl small{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.fl input,.fl select,.fl textarea{width:100%;border:0;outline:0;background:transparent;font-weight:600;font-size:15px;padding:2px 0}
.fl.err{border-color:var(--bad)}.fl .em{color:var(--bad);font-size:12px;font-weight:700;display:none}.fl.err .em{display:block}
.prog{display:flex;gap:5px;flex:1}.prog i{flex:1;height:5px;border-radius:3px;background:#D3DCEE;position:relative;overflow:hidden}.prog i::after{content:"";position:absolute;inset:0;background:var(--royal);transform:scaleX(0);transform-origin:left;transition:transform .5s}.prog i.on::after{transform:scaleX(1)}
.tog{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:14px;background:#CBD5E8;position:relative;transition:background .2s;flex:none;cursor:pointer}.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}.tog:checked{background:var(--royal)}.tog:checked::after{transform:translateX(18px)}
.seg{display:flex;background:#E4EAF6;border-radius:99px;padding:3px}.seg button{flex:1;padding:8px 6px;border-radius:99px;font-weight:700;font-size:13px;color:var(--mut);transition:all .2s}.seg button.on{background:#fff;color:var(--navy);box-shadow:0 2px 6px -2px rgba(11,31,75,.3)}
/* avatar, semáforo, sello */
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(150deg,var(--sky),#8EC5F0);color:var(--navy);display:grid;place-items:center;font-family:var(--f1);font-weight:800;flex:none}
.av.sm{width:30px;height:30px;font-size:12px}
.sem{display:inline-flex;gap:4px;padding:5px 7px;background:#15203A;border-radius:10px}.sem u{width:10px;height:10px;border-radius:50%;background:#3B4766;transition:all .3s}.sem u.g.on{background:#34D399;box-shadow:0 0 10px #34D399}.sem u.y.on{background:#F5B73D;box-shadow:0 0 10px #F5B73D}.sem u.r.on{background:#F26B6B;box-shadow:0 0 10px #F26B6B}
.sello{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #0F2A5C;background:repeating-conic-gradient(#0F2A5C 0 25%,#fff 0 50%) 0 0/7px 7px;vertical-align:-2px}
.flag{height:12px;border-radius:2px;background:repeating-conic-gradient(var(--navy) 0 25%,#fff 0 50%) 0 0/12px 12px;transform-origin:left;animation:draw .9s ease-out both}
.flag.cream{background:repeating-conic-gradient(var(--cream) 0 25%,var(--royal) 0 50%) 0 0/12px 12px}
.stars{color:var(--warn);letter-spacing:2px;font-size:20px}
.star{font-size:34px;color:#D4DBEA;transition:transform .2s,color .2s}.star.on{color:var(--warn);transform:scale(1.12)}
/* timeline */
.ck{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.ck>i{width:20px;height:20px;border-radius:50%;border:2px solid #B9C5DD;flex:none;margin-top:1px;display:grid;place-items:center;transition:all .3s}
.ck.done>i{background:var(--ok);border-color:var(--ok);color:#fff}.ck.now>i{border-color:var(--royal);background:#DDE7FB}
.ck.done>i .ic{width:12px;height:12px}
.sep{height:1px;background:var(--pl);margin:6px 0;border:0}
/* fotos */
.ph{display:grid;place-items:center;background:repeating-linear-gradient(135deg,#E3EAF6 0 8px,#EDF2FA 8px 16px);border-radius:12px;color:var(--mut);font-size:11px;font-weight:700;aspect-ratio:4/3;overflow:hidden;position:relative}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:pop .35s ease-out}
.ph.add{border:1.5px dashed #AFC0E0;cursor:pointer}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* nav */
.nav{position:absolute;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));height:64px;background:#fff;border-radius:32px;box-shadow:0 18px 34px -14px rgba(11,31,75,.6);display:flex;align-items:center;padding:6px;z-index:30;transition:transform .35s cubic-bezier(.3,1.2,.5,1),opacity .25s}
.nav.hide{transform:translateY(120px);opacity:0;pointer-events:none}
.nav button{position:relative;z-index:1;flex:1;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mut);font-family:var(--f1);font-weight:700;font-size:13px;transition:color .25s}
.nav button.on{flex:2.1;color:#fff}.nav button span.lb{display:none}.nav button.on span.lb{display:inline}
.nav .pillbg{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:26px;background:var(--navy);transition:left .35s cubic-bezier(.3,1.2,.5,1),width .35s cubic-bezier(.3,1.2,.5,1)}
.nav button.on .ic{animation:pop .4s}
.badge{position:absolute;top:6px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--coral);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;animation:ping 1.6s infinite}
/* overlays */
.ov{position:absolute;inset:0;z-index:60;background:rgba(11,31,75,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:22px;animation:fade .2s both}
.ov.sheet{align-items:flex-end;padding:0}
.modal{background:#fff;border-radius:26px;padding:22px 20px 18px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:86%;overflow:auto;animation:modalin .35s cubic-bezier(.3,1.3,.5,1) both}
.modal.center{text-align:center;align-items:center}
.sheetbox{background:#fff;border-radius:28px 28px 0 0;padding:10px 18px max(20px,env(safe-area-inset-bottom));width:100%;max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:12px;animation:sheetin .38s cubic-bezier(.3,1.1,.5,1) both;touch-action:pan-y}
.grab{width:38px;height:5px;border-radius:3px;background:#D6DEEE;margin:0 auto;flex:none}
.ov.out{animation:fadeout .2s both}.ov.out .modal{animation:modalout .2s both}.ov.out .sheetbox{animation:sheetout .22s both}
.toasts{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;background:var(--navy);color:#fff;border-radius:18px;padding:11px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 14px 30px -12px rgba(0,0,0,.6);animation:toastin .4s cubic-bezier(.3,1.3,.5,1) both;font-weight:700;font-size:13.5px}
.toast.out{animation:toastout .3s both}
.toast .ti{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.15)}
.toast.ok .ti{background:var(--ok)}.toast.warn .ti{background:var(--warn);color:var(--navy)}.toast.bad .ti{background:var(--bad)}.toast.info .ti{background:var(--royal2)}
.toast .go{margin-left:auto;background:#fff;color:var(--navy);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:800}
canvas.conf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
/* mapa */
.map{position:relative;overflow:hidden;background:#EDF1F7;border-radius:20px;touch-action:none;cursor:grab}
.map.full{border-radius:0;position:absolute;inset:0;z-index:0}
.map .bgm{position:absolute;inset:0;background:
 linear-gradient(90deg,transparent 47%,#fff 47% 53%,transparent 53%) 0 0/90px 90px,
 linear-gradient(0deg,transparent 47%,#fff 47% 53%,transparent 53%) 0 0/90px 90px,
 linear-gradient(90deg,transparent 48.5%,#DCE3EE 48.5% 51.5%,transparent 51.5%) 30px 0/150px 150px,#EDF1F7}
.map .tiles,.map .pins{position:absolute;left:0;top:0;width:0;height:0}
.map .tiles img{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none}
.map svg.rt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.map .pin{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}
.map.mv .pin.mec{transition:transform 1s linear}
.pin .pp{position:absolute;transform:translate(-50%,-100%);background:var(--navy);color:#fff;font-family:var(--f1);font-weight:800;font-size:13px;padding:5px 11px;border-radius:99px;border:2px solid #fff;white-space:nowrap;box-shadow:0 6px 12px -4px rgba(0,0,0,.4);animation:drop .5s cubic-bezier(.3,1.5,.5,1) both}
.pin .pp::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--navy);border-bottom:0}
.pin .pp.sel{background:var(--coral)}.pin .pp.sel::after{border-top-color:var(--coral)}
.pin .me{position:absolute;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:var(--royal);border:3px solid #fff;box-shadow:0 0 0 0 rgba(15,44,140,.45);animation:pulse 2s infinite}
.pin .mec{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:var(--navy);border:3px solid #fff;display:grid;place-items:center;box-shadow:0 8px 14px -6px rgba(0,0,0,.5)}
.pin .mec svg{width:16px;height:16px;transition:transform .8s}
.pin .shop{position:absolute;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:10px;background:var(--navy);border:3px solid #fff;display:grid;place-items:center;color:#fff;box-shadow:0 8px 14px -6px rgba(0,0,0,.5)}
.pin .shop .ic{width:16px;height:16px}
.mapbtns{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
.mapbtns button{width:34px;height:34px;border-radius:10px;background:#fff;font-weight:800;font-size:18px;box-shadow:0 4px 10px -4px rgba(0,0,0,.4)}
.attr{position:absolute;left:6px;bottom:3px;font-size:10px;color:#5B6783;background:rgba(255,255,255,.75);padding:0 4px;border-radius:4px;z-index:3}
.topc{position:absolute;top:max(14px,env(safe-area-inset-top));left:12px;right:12px;z-index:5;background:#fff;border-radius:22px;padding:9px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 26px -12px rgba(11,31,75,.55)}
.sheetfix{position:absolute;left:10px;right:10px;bottom:12px;z-index:5;background:#fff;border-radius:28px;padding:10px 16px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 36px -14px rgba(11,31,75,.6);animation:sheetin .45s cubic-bezier(.3,1.1,.5,1) both}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats>div{background:var(--paper);border-radius:14px;padding:8px 10px}
/* chat */
.chat{display:flex;flex-direction:column;gap:7px}
.bub{max-width:82%;padding:9px 13px;border-radius:18px;font-size:14px;animation:pop .3s ease-out;word-break:break-word}
.bub.o{background:#fff;border-bottom-left-radius:5px;align-self:flex-start;box-shadow:0 0 0 1px var(--pl) inset}
.bub.m{background:var(--royal);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.bub.s{align-self:center;background:var(--sky2);color:var(--navy);font-size:12.5px;font-weight:700;text-align:center}
.bub.w{background:#FFF4DA;align-self:center;font-size:12.5px;font-weight:700}
.typing{display:inline-flex;gap:4px;padding:11px 14px;background:#fff;border-radius:18px;align-self:flex-start;box-shadow:0 0 0 1px var(--pl) inset}.typing i{width:7px;height:7px;border-radius:50%;background:#9AA6BC;animation:bounce 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.chatin{display:flex;gap:8px;align-items:center}.chatin .fl{flex:1;padding:6px 14px;border-radius:99px}.send{width:44px;height:44px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;flex:none;transition:transform .15s}.send:active{transform:scale(.92)}
.hl{animation:hl 1.6s ease-out}
.skel{background:linear-gradient(90deg,#E6ECF7 25%,#F3F6FC 50%,#E6ECF7 75%);background-size:200% 100%;animation:shim 1.2s infinite;border-radius:12px;height:70px}
.wheel{display:inline-block}.wheel.bal{animation:bal 3s ease-in-out infinite}
.wheel.once .spin{animation:spin1 1.4s cubic-bezier(.2,.8,.3,1) both}.wheel .spin{transform-origin:0 0}
.wheel.slow .spin{animation:spin 14s linear infinite}
.qr{border-radius:8px;background:#fff;flex:none}
.demo{position:fixed;right:10px;bottom:10px;z-index:200;background:#0B1F4B;color:#fff;border-radius:99px;padding:8px 14px;font-weight:800;font-size:12px;box-shadow:0 8px 20px -6px rgba(0,0,0,.5)}
.demo.in{position:absolute;right:12px;bottom:92px;z-index:40}
.dlist button.btn3{width:100%}
.empty{text-align:center;padding:26px 14px;display:flex;flex-direction:column;align-items:center;gap:8px}
/* animaciones */
@keyframes fade{from{opacity:0}}@keyframes fadeout{to{opacity:0}}
@keyframes modalin{from{opacity:0;transform:scale(.92)}}@keyframes modalout{to{opacity:0;transform:scale(.94)}}
@keyframes sheetin{from{transform:translateY(100%)}}@keyframes sheetout{to{transform:translateY(100%)}}
@keyframes toastin{from{opacity:0;transform:translateY(-30px)}}@keyframes toastout{to{opacity:0;transform:translateY(-20px)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes draw{from{transform:scaleX(0)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spin1{from{transform:rotate(-360deg)}}
@keyframes pulse{70%{box-shadow:0 0 0 14px rgba(15,44,140,0)}100%{box-shadow:0 0 0 0 rgba(15,44,140,0)}}
@keyframes ping{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes hl{from{background:#CFE8FB}to{background:transparent}}
@keyframes drop{from{opacity:0;transform:translate(-50%,-160%)}}
@keyframes bal{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .4s}.stag>*{animation:up .45s ease-out both}.stag>*:nth-child(2){animation-delay:.06s}.stag>*:nth-child(3){animation-delay:.12s}.stag>*:nth-child(4){animation-delay:.18s}.stag>*:nth-child(5){animation-delay:.24s}.stag>*:nth-child(n+6){animation-delay:.3s}

  if (o.estado === 'recibido' && !o.encuentro_m) { if (!o.bot_at) mut(d => { d.ordenes.find(z => z.id === o.id).bot_at = R + wait; }); else if (o.bot_at <= R) { mut(d => { d.ordenes.find(z => z.id === o.id).bot_at = null; }); encuentroM(o.id); } return; }
  if (o.estado === 'recibido' && o.encuentro_m && !o.encuentro_c) return;
  if (o.estado === 'recibido' && !o.recepcion) { if (!o.bot_at) mut(d => { d.ordenes.find(z => z.id === o.id).bot_at = R + wait; }); else if (o.bot_at <= R) { const f = [0, 1, 2, 3].map(i => samplePhoto(['Frente', 'Atrás', 'Lado izq.', 'Lado der.'][i])); mut(d => { const x = d.ordenes.find(z => z.id === o.id); x.recepcion = { fotos: f, km: 80000 + Math.floor(Math.random() * 30000), comb: '1/2', danos: 'Ninguno', en: now(), ok: true }; x.estado = 'en_revision'; x.recibido_en = now(); x.bot_at = null; f.forEach(z => d.evidencias.push({ id: uid(), orden_id: o.id, tipo: 'foto', url: z, etapa: 'recepcion', creada: Date.now() })); }); notify(o.conductor_id, { kind: 'toast', tone: 'info', body: `${tl.nombre} registró el estado de tu auto (fotos y km). El servicio sigue.`, go: { screen: 'c_orden', p: { id: o.id }, label: 'Ver' } }); } return; }
  if (o.estado === 'en_revision') {
    if (!o.bot_at) { mut(d => { d.ordenes.find(z => z.id === o.id).bot_at = R + (force ? 0 : 5000); }); return; } if (o.bot_at > R) return;
    if (!o.desglose) { mut(d => { const x = d.ordenes.find(z => z.id === o.id); const rep = Math.round(x.precio * .6); x.desglose = { repuesto: rep, mano: x.precio - rep }; d.evidencias.push({ id: uid(), orden_id: o.id, tipo: 'foto', url: samplePhoto('Diagnóstico'), etapa: 'diagnostico', creada: Date.now() }); x.bot_at = R + (force ? 0 : 5000); }); return; }
    if (ajustesDe(o.id).some(a => a.estado === 'pendiente')) return;
    mut(d => { d.ordenes.find(z => z.id === o.id).bot_at = null; }); terminarServicio(o.id);
  }
}

/* ---- tour de primera vez ---- */
const TOURS = {
  conductor: [['#msg', 'Empieza aquí', 'Cuéntale a Pitzi qué le pasa a tu auto. Te dice la causa probable y un rango de precio justo.'], ['[data-n="c_ofertas"]', 'Compara ofertas', 'Los talleres de tu zona te ofertan. Tú eliges: Pitzi nunca recomienda un taller.'], ['[data-n="c_servicio"]', 'Tu servicio en curso', 'Aquí sigues al mecánico, apruebas ajustes de precio y ves tu historial.']],
  mecanico: [['.chs', 'Tus zonas', 'Ves solo clientes cerca de ti. La dirección exacta aparece cuando te aceptan.'], ['[data-n="m_ofertas"]', 'Tus ofertas', 'Ofertas con tu precio. Pagas 5 % solo si te aceptan y concretas el servicio.'], ['[data-n="m_taller"]', 'Tu taller', 'Disponibilidad, comisión por pagar, clientes y tu ficha.']]
};
let _tour = null;
function startTour(role) {
  const L = TOURS[role]; if (!L || _tour) return; let i = 0;
  const ov = document.createElement('div'); ov.className = 'tour'; ov.innerHTML = '<div class="spot"></div><div class="tip"><div class="k" id="tk"></div><div class="t3" id="tt"></div><div class="sm" id="tb"></div><div class="row" style="margin-top:8px"><button class="link" id="ts">Saltar</button><button class="btn3" id="tn">Siguiente</button></div></div>'; PHONE.appendChild(ov); _tour = ov;
  const end = () => { ov.remove(); _tour = null; mut(d => { const u = d.users.find(z => z.id === sessId()); if (u) u.tour = true; }); };
  const go = () => { const st = L[i], el = $(st[0], PHONE); if (!el) { if (++i < L.length) return go(); return end(); } const r = el.getBoundingClientRect(), pr = PHONE.getBoundingClientRect(), sp = $('.spot', ov), tip = $('.tip', ov); const pad = 6; sp.style.cssText = `left:${r.left - pr.left - pad}px;top:${r.top - pr.top - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px`; $('#tk', ov).textContent = `Paso ${i + 1} de ${L.length}`; $('#tt', ov).textContent = st[1]; $('#tb', ov).textContent = st[2]; const below = r.top - pr.top < pr.height / 2; tip.style.top = below ? Math.min(pr.height - 190, r.bottom - pr.top + 16) + 'px' : 'auto'; tip.style.bottom = below ? 'auto' : (pr.bottom - r.top + 16) + 'px'; $('#tn', ov).textContent = i === L.length - 1 ? '¡Entendido!' : 'Siguiente'; };
  $('#tn', ov).onclick = () => { if (++i < L.length) go(); else end(); }; $('#ts', ov).onclick = end; go();
}
function maybeTour() { const u = me(); if (!u || u.tour || _tour || /notour/.test(location.hash) || $('.ov', PHONE) || !cur) return; if (cur.name === 'c_pitzi' || cur.name === 'm_solicitudes') setTimeout(() => { if (!_tour && !$('.ov', PHONE) && me() && !me().tour && cur && (cur.name === 'c_pitzi' || cur.name === 'm_solicitudes')) startTour(u.rol); }, 900); }

function boot() {
  if (/^#video/.test(location.hash) && typeof videoMode === 'function') return videoMode();
  const app = $('#app'); app.innerHTML = `<div class="phone" id="phone"><div class="stage" id="stage"></div><nav class="nav hide" id="nav"></nav><div class="toasts" id="toasts"></div><button class="demo in" id="demo" aria-label="Panel de demo">⚙ Demo</button></div>`;
  PHONE = $('#phone'); STAGE = $('#stage'); TOASTS = $('#toasts'); NAV = $('#nav'); $('#demo').onclick = demoPanel;
  const m = /as=(conductor|mecanico)/.exec(location.hash); if (m) { const id = m[1] === 'conductor' ? 'u_luis' : 'u_julio'; if (DB.users.some(x => x.id === id)) { if (/frame/.test(location.hash)) FRAME_SESS = id; else setSess(id); } } if (/frame/.test(location.hash)) $('#demo').style.display = 'none';
  let tm = null, busy = false;
  on('db', () => { clearTimeout(tm); tm = setTimeout(() => { if (cur && cur.def.update) { try { cur.def.update(cur.el); } catch (e) { console.error(e); } } updateBadges(); if (typeof refreshChat === 'function') refreshChat(); procNotifs(); }, 60); });
  on('quota', () => toast('Se llenó el almacenamiento del navegador. Usa Demo → Borrar datos.', 'bad'));
  const u = me(); if (u) { buildNav(u.rol); const t = u.rol === 'mecanico' ? tallerDe(u.id) : null; if (t && !t.verificado) show('m_revision', {}, 'fade'); else home(); } else home();
  setInterval(jobs, 1000); window.addEventListener('hashchange', () => { if (/as=/.test(location.hash)) location.reload(); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
